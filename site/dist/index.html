    function getActiveSupabaseCreds() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.SB_CREDS) || 'null');
        if (saved && saved.url && saved.key) return saved;
      } catch {}
      return { url: SUPABASE_URL, key: SUPABASE_ANON_KEY };
    }

    function hasRealSupabaseKeys(creds) {
      return Boolean(
        creds &&
        creds.url &&
        creds.key &&
        creds.url.startsWith('https://') &&
        !creds.url.includes('SEU-PROJETO') &&
        !creds.key.includes('SUA-ANON-KEY') &&
        creds.key.length > 20
      );
    }

    function initSupabase() {
      const creds = getActiveSupabaseCreds();
      if (hasRealSupabaseKeys(creds) && window.supabase && typeof window.supabase.createClient === 'function') {
        try {
          supabaseClient = window.supabase.createClient(creds.url.trim(), creds.key.trim());
          isSupabaseActive = true;
          return;
        } catch (err) {
          console.error('Erro ao iniciar Supabase:', err);
        }
      }
      supabaseClient = null;
      isSupabaseActive = false;
    }

    function loadLocalConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.CONFIG);
        if (raw) return { ...structuredClone(DEFAULT_SITE_CONFIG), ...JSON.parse(raw) };
      } catch {}
      return structuredClone(DEFAULT_SITE_CONFIG);
    }

    async function loadRemoteConfig() {
      if (!isSupabaseActive || !supabaseClient) return;
      try {
        const { data, error } = await supabaseClient
          .from('site_config')
          .select('conteudo')
          .eq('chave', 'mgm_site')
          .maybeSingle();
        if (!error && data && data.conteudo) {
          siteConfig = { ...structuredClone(DEFAULT_SITE_CONFIG), ...data.conteudo };
          localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(siteConfig));
          renderSite();
        }
      } catch (err) {
        console.error('Erro ao carregar site_config:', err);
      }
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitizePhone(phone) {
      const digits = String(phone || '').replace(/\D/g, '');
      if (!digits) return siteConfig.contact.whatsappNumber || '5511974243409';
      return digits.startsWith('55') ? digits : `55${digits}`;
    }

    function darkenHex(hex, percent = 12) {
      try {
        const num = parseInt(hex.replace('#', ''), 16);
        const r = Math.max(0, (num >> 16) - Math.round(2.55 * percent));
        const g = Math.max(0, ((num >> 8) & 0x00FF) - Math.round(2.55 * percent));
        const b = Math.max(0, (num & 0x0000FF) - Math.round(2.55 * percent));
        return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1).toUpperCase();
      } catch {
        return '#1558CC';
      }
    }

      root.setProperty('--mgm-navy-deep', darkenHex(c.navy || '#0B1B33', 4));
      root.setProperty('--mgm-blue', c.blue || '#1D6FF2');
      root.setProperty('--mgm-blue-dark', darkenHex(c.blue || '#1D6FF2', 12));
      root.setProperty('--mgm-blue-light', c.blueLight || '#EAF2FF');
      root.setProperty('--mgm-bg', c.bg || '#F6F7F9');
    }

    function formatNowBR() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy}, ${hh}:${min}`;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const bg = type === 'error'
        ? 'bg-rose-600 text-white border-rose-400/40'
        : 'bg-[#0B1B33] text-white border-[#1D6FF2]/40';
      const icon = type === 'error'
        ? `<svg class="w-5 h-5 text-white shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>`
        : `<svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3.5 rounded-2xl border shadow-xl text-sm font-medium animate-fade-up ${bg}`;
      toast.innerHTML = `${icon}<span class="leading-snug">${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3600);
    }

       ========================================================================== */
    async function handleLeadSubmit(event) {
      event.preventDefault();
      const form = event.target;
      const btn = form.querySelector('button[type="submit"]');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span>Enviando diagnóstico...</span>`;

      const fd = new FormData(form);
      const payload = {
        nome: String(fd.get('name') || '').trim(),
        whatsapp: String(fd.get('whatsapp') || '').trim(),
        email: String(fd.get('email') || '').trim(),
        perfil: String(fd.get('profile') || 'Médico'),
        faturamento: String(fd.get('revenue') || 'A definir'),
        mensagem: String(fd.get('message') || '').trim() || 'Solicitação de diagnóstico tributário pelo site.',
        status: 'Novo',
        nota_interna: '',
        lgpd_aceito: true,
      };

      try {
        if (isSupabaseActive && supabaseClient) {
          const { error } = await supabaseClient.from('leads').insert([payload]);
          if (error) throw error;
        } else {
          // Fallback local para testes no mesmo domínio com admin.html
          const existing = JSON.parse(localStorage.getItem(STORAGE_KEYS.LEADS) || '[]');
          existing.unshift({
            id: 'lead-' + Date.now(),
            name: payload.nome,
            profile: payload.perfil,
            whatsapp: payload.whatsapp,
            email: payload.email,
            revenue: payload.faturamento,
            message: payload.mensagem,
            createdAt: formatNowBR(),
            status: 'Novo',
            note: '',
          });
          localStorage.setItem(STORAGE_KEYS.LEADS, JSON.stringify(existing));
        }

        form.reset();
        showToast(`Diagnóstico solicitado com sucesso, ${payload.nome}! Nossa equipe entrará em contato em breve.`);
      } catch (err) {
        console.error('Erro ao enviar lead:', err);
        showToast('Não foi possível enviar sua solicitação. Tente novamente ou chame no WhatsApp.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                      </div>
                      <div>
                        <div class="text-[11px] font-bold uppercase tracking-wider text-blue-300">Endereço</div>
                        <div class="font-semibold text-sm text-slate-200 mt-0.5">${escapeHtml(c.contact.address)}</div>
                      </div>
                    </div>

                    <div class="flex items-start gap-3.5">
                      <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-[#60A5FA] shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      </div>
                      <div>
                        <div class="text-[11px] font-bold uppercase tracking-wider text-blue-300">Horário de Atendimento</div>
                        <div class="font-semibold text-sm text-slate-200 mt-0.5">${escapeHtml(c.contact.hours)}</div>
                      </div>
                    </div>
                  </div>
                </div>

                <a href="${waDirect}" target="_blank" rel="noopener noreferrer" class="mt-8 w-full py-3.5 px-5 rounded-2xl btn-wa font-display font-bold text-sm flex items-center justify-center gap-2.5">
                  ${WHATSAPP_SVG}
                  <span>Iniciar Conversa no WhatsApp</span>
                </a>
              </div>

              <!-- Formulário Real -->
              <div class="bg-canvas rounded-[28px] p-7 sm:p-10 border border-line card-shadow">
                <span class="eyebrow">${escapeHtml(c.form.eyebrow)}</span>
                <h3 class="font-display text-2xl sm:text-3xl font-black text-navy mt-2 leading-tight">
                  ${escapeHtml(c.form.title)}
                </h3>
                <p class="text-sm text-slate-600 mt-2">
                  ${escapeHtml(c.form.subtitle)}
                </p>

                <form onsubmit="handleLeadSubmit(event)" class="mt-6 space-y-4">
                  <div>
                    <label class="label">Nome Completo *</label>
                    <input type="text" name="name" required placeholder="Como podemos te chamar?" class="field" />
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label class="label">WhatsApp *</label>
                      <input type="tel" name="whatsapp" required placeholder="(11) 99999-9999" class="field" />
                    </div>
                    <div>
                      <label class="label">E-mail</label>
                      <input type="email" name="email" placeholder="seu@email.com.br" class="field" />
                    </div>
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label class="label">Você é *</label>
                      <select name="profile" required class="field">
                        ${c.form.profiles.map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}
                      </select>
                    </div>
                    <div>
                      <label class="label">Faturamento Mensal Aproximado</label>
                      <select name="revenue" class="field">
                        ${c.form.revenues.map((r) => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('')}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label class="label">Mensagem</label>
                    <textarea name="message" rows="3" placeholder="Conte brevemente sobre sua necessidade..." class="field"></textarea>
                  </div>
                  <label class="flex items-start gap-2.5 text-xs text-slate-600 cursor-pointer select-none pt-1">
                    <input type="checkbox" required checked class="mt-0.5 w-4 h-4 rounded accent-[#1D6FF2] shrink-0" />
                    <span>${escapeHtml(c.form.lgpdText)}</span>
                  </label>
                  <button type="submit" class="w-full py-3.5 px-6 rounded-2xl btn-brand font-display font-bold text-sm sm:text-base shadow-lg shadow-[#1D6FF2]/25 flex items-center justify-center gap-2">
                    <span>${escapeHtml(c.form.buttonText)}</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                  </button>
                </form>
              </div>
            </div>
          </section>

          <!-- RODAPÉ -->
          <footer class="bg-navy text-white pt-14 pb-8 border-t border-white/10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-8 pb-10 border-b border-white/10">
                <div>
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-brand flex items-center justify-center">
                      <span class="font-display font-black text-white text-sm">${escapeHtml(c.identity.shortName)}</span>
                    </div>
                    <div>
                      <div class="font-display font-extrabold text-lg">${escapeHtml(c.identity.brandName)}</div>
                      <div class="text-xs text-blue-300">${escapeHtml(c.identity.crc)}</div>
                    </div>
                  </div>
                  <p class="mt-4 text-xs sm:text-sm text-slate-300 leading-relaxed">
                    ${escapeHtml(c.contact.footerBio)}
                  </p>
                </div>

                <div>
                  <div class="font-display font-extrabold text-sm uppercase tracking-wider text-blue-300">Navegação</div>
                  <ul class="mt-4 space-y-2.5 text-sm text-slate-300">
                    <li><a href="#solucoes" class="hover:text-white transition">Serviços Contábeis</a></li>
                    <li><a href="#segmentos" class="hover:text-white transition">Para quem atendemos</a></li>
                    <li><a href="#sobre" class="hover:text-white transition">Por que a MGM</a></li>
                    <li><a href="#diagnostico" class="hover:text-white transition">Solicitar Diagnóstico</a></li>
                  </ul>
                </div>

                <div>
                  <div class="font-display font-extrabold text-sm uppercase tracking-wider text-blue-300">Redes & Acesso</div>
                  <div class="mt-4 flex items-center gap-3">
                    <a href="${escapeHtml(c.contact.instagram)}" target="_blank" rel="noopener noreferrer" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-brand text-xs font-bold transition">Instagram</a>
                    <a href="${escapeHtml(c.contact.linkedin)}" target="_blank" rel="noopener noreferrer" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-brand text-xs font-bold transition">LinkedIn</a>
                    <a href="${waDirect}" target="_blank" rel="noopener noreferrer" class="px-3.5 py-2 rounded-xl bg-[#1FA855] hover:opacity-90 text-xs font-bold transition">WhatsApp</a>
                  </div>
                  <a href="${ADMIN_PANEL_URL}" class="mt-5 inline-flex items-center gap-2 text-xs font-bold text-blue-300 hover:text-white transition">
                    <span>Acessar Painel Administrativo MGM &rarr;</span>
                  </a>
                </div>
              </div>

              <div class="pt-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-400">
                <span>${escapeHtml(c.contact.copyright)}</span>
                <span>Guarulhos/SP • Atendimento Grande SP & 100% Digital</span>
              </div>
            </div>
          </footer>

          <!-- Botão Flutuante WhatsApp -->
          <a href="${waDirect}" target="_blank" rel="noopener noreferrer" aria-label="Falar no WhatsApp" class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full btn-wa shadow-2xl shadow-[#1FA855]/40 flex items-center justify-center hover:scale-105 transition">
            <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M20.52 3.48A11.86 11.86 0 0012.06 0C5.49 0 .14 5.35.14 11.92c0 2.1.55 4.15 1.59 5.96L0 24l6.28-1.65a11.87 11.87 0 005.78 1.47h.01c6.57 0 11.92-5.35 11.92-11.92 0-3.18-1.24-6.18-3.47-8.42zM12.07 21.8h-.01a9.87 9.87 0 01-5.04-1.38l-.36-.21-3.73.98.99-3.64-.24-.37a9.87 9.87 0 01-1.52-5.26c0-5.46 4.44-9.9 9.91-9.9 2.65 0 5.13 1.03 7 2.9a9.84 9.84 0 012.9 7c0 5.46-4.45 9.88-9.9 9.88zm5.43-7.42c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.21 5.09 4.5.71.31 1.27.49 1.7.63.72.23 1.37.2 1.88.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35z"/></svg>
          </a>
        </div>
      `;
    }

    async function initSite() {
      initSupabase();
      renderSite();
      await loadRemoteConfig();
    }
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initSite);
    } else {
      initSite();
    }
  </script>
</body>
</html>
