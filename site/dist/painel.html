    // Supabase Auth helpers
    function getAuthHeaders() {
      const token = state.accessToken || SUPA_KEY;
      return {
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
      };
    }

    async function supabaseSignIn(email, password) {
      const r = await fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error_description || data.msg || 'Falha no login');
      state.accessToken = data.access_token;
      state.user = data.user;
      localStorage.setItem('mgm_access_token', data.access_token);
      localStorage.setItem('mgm_refresh_token', data.refresh_token || '');
      return data;
    }

    async function supabaseSignOut() {
      try {
        await fetch(SUPA_URL + '/auth/v1/logout', {
          method: 'POST',
          headers: getAuthHeaders(),
        });
      } catch (e) { console.error('logout err', e); }
      state.accessToken = null;
      state.user = null;
      localStorage.removeItem('mgm_access_token');
      localStorage.removeItem('mgm_refresh_token');
      state.viewMode = 'login';
      renderApp();
    }

    async function supabaseRestoreSession() {
      const token = localStorage.getItem('mgm_access_token');
      if (!token) return false;
      try {
        const r = await fetch(SUPA_URL + '/auth/v1/user', {
          headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token },
        });
        if (!r.ok) throw new Error('invalid session');
        const user = await r.json();
        state.accessToken = token;
        state.user = user;
        return true;
      } catch (e) {
        localStorage.removeItem('mgm_access_token');
        localStorage.removeItem('mgm_refresh_token');
        return false;
      }
    }

    // Supabase: carrega leads
    async function loadLeadsFromSupabase() {
      try {
        const r = await fetch(SUPA_URL + '/rest/v1/leads?select=*', { headers: getAuthHeaders() });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const rows = await r.json();
        return rows.map(row => ({
          id: row.id,
          name: row.name || row.nome || '',
          profile: row.profile || row.perfil || '',
          whatsapp: row.whatsapp || '',
          email: row.email || '',
          revenue: row.revenue || row.faturamento_mensal || '',
          message: row.message || row.mensagem || '',
          createdAt: row.created_at ? new Date(row.created_at).toLocaleString('pt-BR') : (row.createdAt || ''),
          status: row.status || 'Novo',
          note: row.note || '',
        }));
      } catch (err) {
        console.error('Erro ao carregar leads do Supabase:', err);
        return structuredClone(DEFAULT_LEADS);
      }
    }

    // Supabase: carrega config
    async function loadConfigFromSupabase() {
      try {
        const r = await fetch(SUPA_URL + '/rest/v1/site_config?select=*&key=eq.identity', { headers: getAuthHeaders() });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const rows = await r.json();
        if (rows && rows.length) {
          return { ...DEFAULT_SITE_CONFIG, ...rows[0].value };
        }
        return structuredClone(DEFAULT_SITE_CONFIG);
      } catch (err) {
        console.error('Erro ao carregar config do Supabase:', err);
        return structuredClone(DEFAULT_SITE_CONFIG);
      }
    }

    // Supabase: salva leads (upsert por id)
    async function saveLeadsToSupabase(leads) {
      try {
        for (const lead of leads) {
          const body = {
            nome: lead.name,
            name: lead.name,
            perfil: lead.profile,
            profile: lead.profile,
            whatsapp: lead.whatsapp,
            email: lead.email,
            faturamento_mensal: lead.revenue,
            revenue: lead.revenue,
            mensagem: lead.message,
            message: lead.message,
            status: lead.status,
            note: lead.note,
          };
          if (lead.id && String(lead.id).match(/^[0-9a-f-]{36}$/)) {
            await fetch(SUPA_URL + '/rest/v1/leads?id=eq.' + lead.id, {
              method: 'PATCH', headers: getAuthHeaders(), body: JSON.stringify(body),
            });
          } else {
            const r = await fetch(SUPA_URL + '/rest/v1/leads', {
              method: 'POST', headers: getAuthHeaders(), body: JSON.stringify(body),
            });
            const rows = await r.json();
            if (rows && rows[0]) lead.id = rows[0].id;
          }
        }
      } catch (err) {
        console.error('Erro ao salvar leads no Supabase:', err);
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatNowBR() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy}, ${hh}:${min}`;
    }

    function sanitizePhone(phone) {
      const digits = String(phone || '').replace(/\D/g, '');
      if (!digits) return state.config.contact.whatsappNumber || '5511983845482';
      return digits.startsWith('55') ? digits : `55${digits}`;
    }

    function darkenHex(hex, percent = 14) {
      try {
        let num = parseInt(hex.replace('#', ''), 16);
        let r = Math.max(0, (num >> 16) - Math.round(2.55 * percent));
        let g = Math.max(0, ((num >> 8) & 0x00FF) - Math.round(2.55 * percent));
        let b = Math.max(0, (num & 0x0000FF) - Math.round(2.55 * percent));
        return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1).toUpperCase();
      } catch {
        return '#1558CC';
      }
    }

    function applyThemeTokens() {
      const c = state.config.colors || DEFAULT_COLORS;
      const root = document.documentElement.style;
      root.setProperty('--mgm-navy', c.navy || '#0B1B33');
      root.setProperty('--mgm-navy-deep', darkenHex(c.navy || '#0B1B33', 4));
      root.setProperty('--mgm-blue', c.blue || '#1D6FF2');
      root.setProperty('--mgm-blue-dark', darkenHex(c.blue || '#1D6FF2', 12));
      root.setProperty('--mgm-blue-light', c.blueLight || '#EAF2FF');
      root.setProperty('--mgm-bg', c.bg || '#F6F7F9');
    }

    async function persistAll(silent = false) {
      state.saveStatus = 'Salvando...';
      updateSaveIndicator();
      await saveLeadsToSupabase(state.leads);
      await saveConfigToSupabase(state.config);
      applyThemeTokens();

      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        state.saveStatus = 'Salvo';
        updateSaveIndicator();

        }

    function addLead({ name, profile, whatsapp, email, revenue, message, status = 'Novo', note = '' }) {
      const newLead = {
        id: 'lead-' + Date.now() + '-' + Math.random().toString(16).slice(2, 6),
        name: name.trim(),
        profile: profile || 'Médico',
        whatsapp: whatsapp.trim(),
        email: email.trim(),
        revenue: revenue || 'A definir',
        message: message.trim() || 'Solicitação de diagnóstico tributário pelo site.',
        createdAt: formatNowBR(),
        status,
        note,
      };
      state.leads.unshift(newLead);
      persistAll();
      return newLead;
    }

    function updateLeadStatus(leadId, newStatus) {
      const lead = state.leads.find((l) => l.id === leadId);
      if (!lead) return;
      lead.status = newStatus;
      persistAll();
      renderApp();
      showToast(`Status de ${lead.name} atualizado para "${newStatus}".`);
    }

    function saveLeadNote(leadId) {
      const input = document.getElementById(`note-input-${leadId}`);
      const lead = state.leads.find((l) => l.id === leadId);
      if (!lead || !input) return;
      lead.note = input.value.trim();
      persistAll();
      showToast(`Nota interna de ${lead.name} salva com sucesso.`);
    }

    function requestDeleteLead(leadId) {
      const lead = state.leads.find((l) => l.id === leadId);
      if (!lead) return;
      openConfirmModal({
        title: 'Excluir Lead',
        message: `Tem certeza que deseja remover "${lead.name}" da lista de leads? Esta ação não pode ser desfeita.`,
        confirmLabel: 'Excluir Lead',
        danger: true,
        onConfirm: () => {
          if (String(leadId).match(/^[0-9a-f-]{36}$/)) {
            fetch(SUPA_URL + '/rest/v1/leads?id=eq.' + leadId, { method: 'DELETE', headers: getAuthHeaders() }).catch(e => console.error('Erro ao excluir lead no Supabase:', e));
          }
          state.leads = state.leads.filter((l) => l.id !== leadId);
          persistAll();
          renderApp();
          showToast('Lead removido com sucesso.', 'info');
        },
      });
    }

    function exportLeadsCSV() {
      const headers = ['Nome', 'Data/Hora', 'Status', 'Perfil', 'WhatsApp', 'E-mail', 'Faturamento', 'Mensagem', 'Nota Interna'];
      const rows = state.leads.map((l) => [
        l.name, l.createdAt, l.status, l.profile, l.whatsapp, l.email, l.revenue, l.message, l.note || '',
      ]);

      const csvContent = '\uFEFF' + [headers, ...rows]
        .map((row) => row.map((cell) => `"${String(cell || '').replace(/"/g, '""')}"`).join(';'))
        .join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `leads-mgm-contabilidade-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Arquivo CSV exportado com sucesso!');
    }

      let target = state.config;
      for (let i = 0; i < keys.length - 1; i++) {

    function handleImportJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed.identity || !parsed.hero) {
            throw new Error('Estrutura JSON inválida.');
          }
          state.config = { ...structuredClone(DEFAULT_SITE_CONFIG), ...parsed };
          persistAll();
          renderApp();
          showToast('Configurações importadas com sucesso!');
        } catch (err) {
          showToast('Erro ao importar JSON: arquivo incompatível.', 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    async function quickLogin() {
      // Tenta login real com as credenciais padrão do formulário
      const email = (document.getElementById('login-email') || {}).value || 'admin@mgmcontabilidade.com.br';
      const password = (document.getElementById('login-password') || {}).value || '';
      if (!email || !password) {
        showToast('Informe e-mail e senha.', 'error');
        return;
      }
      try {
        await supabaseSignIn(email, password);
        state.viewMode = 'admin';
        renderApp();
        showToast('Bem-vindo ao Painel Administrativo MGM!');
      } catch (err) {
        showToast('Falha no login: ' + (err.message || 'credenciais inválidas'), 'error');
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      await quickLogin();
    }

    function switchView(mode) {
      state.viewMode = mode;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchTab(tab) {
      state.activeTab = tab;
      renderApp();
    }

                <div class="w-11 h-11 rounded-2xl bg-brand flex items-center justify-center shrink-0 shadow-lg shadow-[#1D6FF2]/30">
                  <span class="font-display font-black text-white text-base tracking-tight">${escapeHtml(state.config.identity.shortName)}</span>

    /* ==========================================================================
       ABA 1: GERENCIAR LEADS
       ========================================================================== */
    function renderLeadsTab() {
      const statuses = ['Todos', 'Novo', 'Em atendimento', 'Convertido', 'Perdido'];
      const total = state.leads.length;
      const novos = state.leads.filter((l) => l.status === 'Novo').length;
      const emAtendimento = state.leads.filter((l) => l.status === 'Em atendimento').length;
      const convertidos = state.leads.filter((l) => l.status === 'Convertido').length;
      const taxaConversao = total > 0 ? Math.round((convertidos / total) * 100) : 0;

      const countByStatus = (st) => (st === 'Todos' ? total : state.leads.filter((l) => l.status === st).length);

      // Filtragem dos leads
      const filteredLeads = state.leads.filter((lead) => {
        if (state.leadFilters.status !== 'Todos' && lead.status !== state.leadFilters.status) return false;
        if (state.leadFilters.profile !== 'Todos os perfis' && lead.profile !== state.leadFilters.profile) return false;
        if (state.leadFilters.search.trim()) {
          const q = state.leadFilters.search.toLowerCase();
          const haystack = `${lead.name} ${lead.whatsapp} ${lead.email} ${lead.message} ${lead.profile} ${lead.revenue} ${lead.note || ''}`.toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        return true;
      });

      const profilesFilter = ['Todos os perfis', ...state.config.form.profiles];

      return `
        <div class="space-y-6 animate-fade-up">
          <!-- Mini barra de KPIs -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5 sm:gap-4">
            <div class="bg-white rounded-[22px] p-4 sm:p-5 border border-line soft-shadow">
              <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">Total de Leads</div>
              <div class="mt-1.5 flex items-baseline justify-between">
                <span class="font-display text-2xl sm:text-3xl font-black text-navy">${total}</span>
                <span class="text-xs font-bold text-slate-500">Base ativa</span>
              </div>
            </div>
            <div class="bg-white rounded-[22px] p-4 sm:p-5 border border-line soft-shadow">
              <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">Novos</div>
              <div class="mt-1.5 flex items-baseline justify-between">
                <span class="font-display text-2xl sm:text-3xl font-black text-brand">${novos}</span>
                <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-brand-light text-brand">Aguardando</span>
              </div>
            </div>
            <div class="bg-white rounded-[22px] p-4 sm:p-5 border border-line soft-shadow">
              <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">Em Atendimento</div>
              <div class="mt-1.5 flex items-baseline justify-between">
                <span class="font-display text-2xl sm:text-3xl font-black text-amber-600">${emAtendimento}</span>
                <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-50 text-amber-700">Negociação</span>
              </div>
            </div>
            <div class="bg-white rounded-[22px] p-4 sm:p-5 border border-line soft-shadow">
              <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">Taxa de Conversão</div>
              <div class="mt-1.5 flex items-baseline justify-between">
                <span class="font-display text-2xl sm:text-3xl font-black text-emerald-600">${taxaConversao}%</span>
                <span class="text-xs font-bold text-emerald-700">${convertidos} convertido${convertidos !== 1 ? 's' : ''}</span>
              </div>
            </div>
          </div>

          <!-- Pílulas de Status + Ações -->
          <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <div class="flex flex-wrap items-center gap-2">
              ${statuses.map((st) => {
                const active = state.leadFilters.status === st;
                return `
                  <button type="button" onclick="setLeadStatusFilter('${st}')" class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs sm:text-sm font-bold transition ${
                    active
                      ? 'bg-navy text-white shadow-md'
                      : 'bg-white text-slate-600 border border-line hover:border-brand/40 hover:text-navy'
                  }">
                    <span>${st}</span>
                    <span class="px-1.5 py-0.5 rounded-full text-[11px] font-extrabold ${active ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-500'}">${countByStatus(st)}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <button type="button" onclick="openNewLeadModal()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl btn-brand text-xs sm:text-sm font-bold shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                <span>+ Novo Lead</span>
              </button>
              <button type="button" onclick="exportLeadsCSV()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white border border-line text-navy hover:bg-slate-50 text-xs sm:text-sm font-bold transition">
                <svg class="w-4 h-4 text-brand" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                <span>Exportar CSV</span>
              </button>
            </div>
          </div>

          <!-- Filtros de PERFIL e BUSCAR -->
          <div class="bg-white rounded-[24px] p-4 sm:p-5 border border-line soft-shadow grid grid-cols-1 md:grid-cols-[260px_1fr] gap-4">
            <div>
              <label class="label">PERFIL</label>
              <select onchange="setLeadProfileFilter(this.value)" class="field">
                ${profilesFilter.map((p) => `<option value="${escapeHtml(p)}" ${state.leadFilters.profile === p ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="label">BUSCAR</label>
              <div class="relative">
                <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input
                  type="text"
                  id="lead-search-input"
                  value="${escapeHtml(state.leadFilters.search)}"
                  oninput="setLeadSearchFilter(this.value)"
                  placeholder="Nome, WhatsApp, e-mail, mensagem..."
                  class="field !pl-10"
                />
              </div>
            </div>
          </div>

          <!-- Lista de Cards de Leads -->
          <div class="space-y-4">
            ${filteredLeads.length === 0 ? `
              <div class="bg-white rounded-[26px] p-12 text-center border border-line soft-shadow">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-brand-light text-brand flex items-center justify-center">
                  <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <h3 class="font-display text-lg font-extrabold text-navy mt-4">Nenhum lead encontrado</h3>
                <p class="text-sm text-slate-500 mt-1">Tente ajustar os filtros de status, perfil ou termo de busca.</p>
                <button type="button" onclick="clearLeadFilters()" class="mt-4 px-4 py-2 rounded-xl bg-brand-light text-brand text-xs font-bold hover:opacity-90">
                  Limpar filtros
                </button>
              </div>
            ` : filteredLeads.map((lead) => renderLeadCard(lead)).join('')}
          </div>
        </div>
      `;
    }

    function renderLeadCard(lead) {
      const waText = encodeURIComponent(`Olá ${lead.name}! Tudo bem? Aqui é da ${state.config.identity.brandName}. Recebemos sua solicitação de diagnóstico tributário e gostaríamos de conversar sobre o perfil ${lead.profile}.`);
      const waLink = `https://wa.me/${sanitizePhone(lead.whatsapp)}?text=${waText}`;

      return `
        <article class="bg-white rounded-[26px] p-5 sm:p-6 border border-line soft-shadow hover:border-[#1D6FF2]/30 transition">
          <!-- Cabeçalho do Card -->

              <h3 class="font-display text-lg sm:text-xl font-extrabold text-navy leading-tight">${escapeHtml(lead.name)}</h3>

              <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">PERFIL</div>
              <div class="mt-1 text-sm font-bold text-navy">${escapeHtml(lead.profile)}</div>
            </div>
            <div>
              <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">WHATSAPP</div>
              <div class="mt-1 text-sm font-bold text-navy break-all">${escapeHtml(lead.whatsapp)}</div>
            </div>
            <div>
              <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">E-MAIL</div>
              <div class="mt-1 text-sm font-bold text-navy break-all">${escapeHtml(lead.email)}</div>
            </div>

              <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">FATURAMENTO</div>
              <div class="mt-1 text-sm font-bold text-brand">${escapeHtml(lead.revenue)}</div>
            </div>
          </div>

          <!-- Mensagem entre aspas em itálico -->
          <div class="rounded-2xl bg-canvas border border-line/80 px-4 py-3 text-sm italic text-slate-700">
            "${escapeHtml(lead.message)}"
          </div>

          <!-- Controles de Status + WhatsApp + Excluir -->
          <div class="mt-4 flex flex-col sm:flex-row sm:items-end justify-between gap-3 pt-1">
            <div class="flex flex-wrap items-end gap-3">
              <div class="w-48">
                <label class="label">STATUS</label>
                <select onchange="updateLeadStatus('${lead.id}', this.value)" class="field !py-2 !text-xs !font-bold">
                  ${['Novo', 'Em atendimento', 'Convertido', 'Perdido'].map((st) => `
                    <option value="${st}" ${lead.status === st ? 'selected' : ''}>${st}</option>
                  `).join('')}
                </select>
              </div>
              <a href="${waLink}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl btn-wa text-xs sm:text-sm font-bold shadow-sm">
                ${WHATSAPP_SVG}
                <span>Chamar no WhatsApp</span>
              </a>
            </div>

            <button type="button" onclick="requestDeleteLead('${lead.id}')" class="inline-flex items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-xl border border-rose-200 bg-rose-50/70 text-rose-600 hover:bg-rose-100 text-xs font-bold transition self-start sm:self-end">

          <!-- Nota Interna -->
          <div class="mt-4 pt-4 border-t border-line">

                Salvar nota
              </button>
            </div>
          </div>
        </article>
      `;

    function setLeadStatusFilter(status) {
      state.leadFilters.status = status;
      renderApp();
    }

    function setLeadProfileFilter(profile) {
      state.leadFilters.profile = profile;
      renderApp();
    }

    function setLeadSearchFilter(val) {
      state.leadFilters.search = val;
      const caret = document.getElementById('lead-search-input')?.selectionStart || val.length;
      renderApp();
      const input = document.getElementById('lead-search-input');
      if (input) {
        input.focus();
        input.setSelectionRange(caret, caret);
      }
    }

    function clearLeadFilters() {
      state.leadFilters = { status: 'Todos', profile: 'Todos os perfis', search: '' };
      renderApp();
    }

    function updateArrayItem(listKey, index, field, value) {
      state.config[listKey][index][field] = value;
      persistAll(true);
    }

    function removeArrayItem(listKey, index) {
      state.config[listKey].splice(index, 1);
      persistAll();
      renderApp();
      showToast('Item removido.', 'info');
    }

    function addMetricItem() {
      state.config.metrics.push({ id: 'm-' + Date.now(), value: '+100', label: 'Novo Indicador', desc: 'Descrição do resultado' });
      persistAll();
      renderApp();
    }

    function addServiceItem() {
      state.config.services.push({ id: 's-' + Date.now(), icon: 'chart', tag: 'Destaque', title: 'Novo Serviço Contábil', desc: 'Descreva os benefícios e entregas deste serviço.' });
      persistAll();
      renderApp();
    }

    function addDifferentialItem() {
      state.config.about.differentials.push('Novo diferencial estratégico da MGM Contabilidade');
      persistAll();
      renderApp();
    }

    function updateDifferentialItem(idx, value) {
      state.config.about.differentials[idx] = value;
      persistAll(true);
    }

    function removeDifferentialItem(idx) {
      state.config.about.differentials.splice(idx, 1);
      persistAll();
      renderApp();

    function addFormOption(listName, inputId) {
      const input = document.getElementById(inputId);
      if (!input || !input.value.trim()) return;
      state.config.form[listName].push(input.value.trim());
      persistAll();
      renderApp();
      showToast('Opção adicionada ao formulário!');
    }

    function removeFormOption(listName, idx) {
      if (state.config.form[listName].length <= 1) {
        showToast('Mantenha pelo menos uma opção ativa.', 'error');
        return;
      }
      state.config.form[listName].splice(idx, 1);
      persistAll();
      renderApp();
    }

    function handleDiagnosticFormSubmit(event, formId) {
      event.preventDefault();
      const form = event.target;
      const fd = new FormData(form);
      const lead = addLead({
        name: fd.get('name'),
        whatsapp: fd.get('whatsapp'),
        email: fd.get('email'),
        profile: fd.get('profile'),
        revenue: fd.get('revenue'),
        message: fd.get('message'),
      });
      form.reset();

      if (state.viewMode === 'admin') {
        renderApp();
        showToast(`Lead "${lead.name}" registrado no topo de Gerenciar Leads!`);
      } else {
        showToast(`Diagnóstico solicitado com sucesso, ${lead.name}! Nossa equipe entrará em contato.`);
      }
    }

    /* ==========================================================================
       RENDERIZAÇÃO PRINCIPAL
       ========================================================================== */
    function renderApp() {
      applyThemeTokens();
      const app = document.getElementById('app');
      if (!app) return;

      if (state.viewMode === 'login') {
        app.innerHTML = renderLoginView();
      } else if (state.viewMode === 'live') {
        app.innerHTML = renderInstitutionalSite(false, false);
      } else {
        app.innerHTML = renderAdminView();
      }
    }

    // Inicialização: carrega dados do Supabase antes de renderizar
    window.addEventListener('DOMContentLoaded', async () => {
      const restored = await supabaseRestoreSession();
      if (restored) state.viewMode = 'admin';
      else state.viewMode = 'login';
      try {
        const [leads, config] = await Promise.all([loadLeadsFromSupabase(), loadConfigFromSupabase()]);
        state.leads = leads;
        state.config = config;
        applyThemeTokens();
      } catch (e) {
        console.error('Falha ao carregar do Supabase:', e);
      }
      renderApp();
    });
  </script>
