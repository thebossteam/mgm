    function getActiveSupabaseCreds() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.SB_CREDS) || 'null');
        if (saved && saved.url && saved.key) return saved;
      } catch {}
      return { url: SUPABASE_URL, key: SUPABASE_ANON_KEY };
    }

    function hasRealSupabaseKeys(creds) {
      return Boolean(
        creds &&
        creds.url &&
        creds.key &&
        creds.url.startsWith('https://') &&
        !creds.url.includes('SEU-PROJETO') &&
        !creds.key.includes('SUA-ANON-KEY') &&
        creds.key.length > 20
      );
    }

    function initSupabaseClient() {
      const creds = getActiveSupabaseCreds();
      if (hasRealSupabaseKeys(creds) && window.supabase && typeof window.supabase.createClient === 'function') {
        try {
          supabaseClient = window.supabase.createClient(creds.url.trim(), creds.key.trim());
          isSupabaseActive = true;
          return true;
        } catch (err) {
          console.error('Erro ao iniciar Supabase:', err);
        }
      }
      supabaseClient = null;
      isSupabaseActive = false;
      return false;
    }

    function formatIsoToBR(iso) {
      try {
        const d = new Date(iso);
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yyyy = d.getFullYear();
        const hh = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${dd}/${mm}/${yyyy}, ${hh}:${min}`;
      } catch {
        return formatNowBR();
      }
    }

    function mapSupabaseLead(row) {
      return {
        id: row.id,
        name: row.nome || '',
        profile: row.perfil || 'Outro',
        whatsapp: row.whatsapp || '',
        email: row.email || '',
        revenue: row.faturamento || 'A definir',
        message: row.mensagem || '',
        createdAt: row.created_at ? formatIsoToBR(row.created_at) : formatNowBR(),
        status: row.status || 'Novo',
        note: row.nota_interna || '',
      };
    }

    async function syncFromSupabase() {
      if (!isSupabaseActive || !supabaseClient) return;
      try {
        const { data: cfgRows } = await supabaseClient
          .from('site_config')
          .select('*')
          .eq('chave', 'mgm_site');
        if (cfgRows && cfgRows.length > 0 && cfgRows[0].conteudo) {
          state.config = { ...structuredClone(DEFAULT_SITE_CONFIG), ...cfgRows[0].conteudo };
          saveToStorage(STORAGE_KEYS.CONFIG, state.config);
        }

        const { data: sessionData } = await supabaseClient.auth.getSession();
        state.authUser = sessionData?.session?.user || null;
        state.isAuthenticated = Boolean(state.authUser);

        if (state.authUser) {
          const { data: leadRows, error } = await supabaseClient
            .from('leads')
            .select('*')
            .order('created_at', { ascending: false });
          if (!error && Array.isArray(leadRows)) {
            state.leads = leadRows.map(mapSupabaseLead);
            saveToStorage(STORAGE_KEYS.LEADS, state.leads);
          }
        }
      } catch (err) {
        console.error('Erro ao sincronizar com Supabase:', err);
      } finally {
        renderApp();
      }
    }

    async function saveSiteConfigToBank() {
      persistAll();
      if (isSupabaseActive && supabaseClient) {
        state.saveStatus = 'Salvando...';
        updateSaveIndicator();
        const { error } = await supabaseClient.from('site_config').upsert({
          chave: 'mgm_site',
          conteudo: state.config,
          updated_at: new Date().toISOString(),
        });
        state.saveStatus = 'Salvo';
        updateSaveIndicator();
        if (error) {
          showToast('Erro ao salvar no Supabase: ' + error.message, 'error');
        } else {
          showToast('Configurações publicadas no Supabase (site_config)!');
        }
      } else {
        showToast('Alterações salvas localmente (Modo Demo)!');
      }
    }

    function formatNowBR() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy}, ${hh}:${min}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitizePhone(phone) {
      const digits = String(phone || '').replace(/\D/g, '');
      if (!digits) return state.config.contact.whatsappNumber || '5511974243409';
      return digits.startsWith('55') ? digits : `55${digits}`;
    }

    function darkenHex(hex, percent = 12) {
      try {
        const num = parseInt(hex.replace('#', ''), 16);
        const r = Math.max(0, (num >> 16) - Math.round(2.55 * percent));
        const g = Math.max(0, ((num >> 8) & 0x00FF) - Math.round(2.55 * percent));
        const b = Math.max(0, (num & 0x0000FF) - Math.round(2.55 * percent));
        return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1).toUpperCase();
      } catch {
        return '#1558CC';
      }
    }

    function applyThemeTokens() {
      const c = state.config.colors || DEFAULT_COLORS;
      const root = document.documentElement.style;
      root.setProperty('--mgm-navy', c.navy || '#0B1B33');
      root.setProperty('--mgm-navy-deep', darkenHex(c.navy || '#0B1B33', 4));
      root.setProperty('--mgm-blue', c.blue || '#1D6FF2');
      root.setProperty('--mgm-blue-dark', darkenHex(c.blue || '#1D6FF2', 12));
      root.setProperty('--mgm-blue-light', c.blueLight || '#EAF2FF');
      root.setProperty('--mgm-bg', c.bg || '#F6F7F9');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const bg = type === 'error'
        ? 'bg-rose-600 text-white border-rose-400/40'
        : 'bg-[#0B1B33] text-white border-[#1D6FF2]/40';
      const icon = type === 'error'
        ? `<svg class="w-5 h-5 text-white shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>`
        : `<svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3.5 rounded-2xl border shadow-xl text-sm font-medium animate-fade-up ${bg}`;
      toast.innerHTML = `${icon}<span class="leading-snug">${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';

    async function addLead({ name, profile, whatsapp, email, revenue, message, status = 'Novo', note = '' }) {
      const payload = {
        nome: name.trim(),
        perfil: profile || 'Médico',
        whatsapp: whatsapp.trim(),
        email: email.trim(),
        faturamento: revenue || 'A definir',
        mensagem: message.trim() || 'Cadastro via painel administrativo.',
        status,
        nota_interna: note,
        lgpd_aceito: true,
      };

      if (isSupabaseActive && supabaseClient) {
        const { data, error } = await supabaseClient.from('leads').insert([payload]).select();
        if (error) {
          showToast('Erro ao salvar lead no Supabase: ' + error.message, 'error');
        } else if (data && data[0]) {
          const mapped = mapSupabaseLead(data[0]);
          state.leads.unshift(mapped);
          saveToStorage(STORAGE_KEYS.LEADS, state.leads);
          return mapped;
        }
      }

      const newLead = {
        id: 'lead-' + Date.now() + '-' + Math.random().toString(16).slice(2, 6),
        name: payload.nome,
        profile: payload.perfil,
        whatsapp: payload.whatsapp,
        email: payload.email,
        revenue: payload.faturamento,
        message: payload.mensagem,
        createdAt: formatNowBR(),
        status,
        note,
      };
      state.leads.unshift(newLead);
      persistAll();
      return newLead;
    }

    async function updateLeadStatus(leadId, newStatus) {
      const lead = state.leads.find((l) => l.id === leadId);
      if (!lead) return;
      lead.status = newStatus;
      persistAll();

      if (isSupabaseActive && supabaseClient) {
        const { error } = await supabaseClient
          .from('leads')
          .update({ status: newStatus, nota_interna: lead.note || '' })
          .eq('id', leadId);
        if (error) {
          showToast('Erro ao atualizar no Supabase: ' + error.message, 'error');
          return;
        }
      }

      renderApp();
      showToast(`Status de ${lead.name} atualizado para "${newStatus}".`);
    }

    async function saveLeadNote(leadId) {
      const input = document.getElementById(`note-input-${leadId}`);
      const lead = state.leads.find((l) => l.id === leadId);
      if (!lead || !input) return;
      lead.note = input.value.trim();
      persistAll();

      if (isSupabaseActive && supabaseClient) {
        const { error } = await supabaseClient
          .from('leads')
          .update({ status: lead.status, nota_interna: lead.note })
          .eq('id', leadId);
        if (error) {
          showToast('Erro ao salvar nota no Supabase: ' + error.message, 'error');
          return;
        }
      }

      showToast(`Nota interna de ${lead.name} salva!`);
    }

      const lead = state.leads.find((l) => l.id === leadId);
      if (!lead) return;
      openConfirmModal({
        title: 'Excluir Lead',
        message: `Deseja remover "${lead.name}" permanentemente?`,
        confirmLabel: 'Excluir Lead',
        danger: true,
        onConfirm: async () => {
          if (isSupabaseActive && supabaseClient) {
            const { error } = await supabaseClient.from('leads').delete().eq('id', leadId);
            if (error) {
              showToast('Erro ao excluir no Supabase: ' + error.message, 'error');

            }

          state.leads = state.leads.filter((l) => l.id !== leadId);
          persistAll();
          renderApp();
          showToast('Lead removido.', 'info');
        },
      });
    }

    function exportLeadsCSV() {
      if (!state.leads.length) {
        showToast('Não há leads para exportar.', 'info');
        return;
      }
      const headers = ['ID', 'Nome', 'Perfil', 'WhatsApp', 'E-mail', 'Faturamento', 'Mensagem', 'Data', 'Status', 'Nota Interna'];
      const escapeCsv = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
      const rows = state.leads.map((l) => [
        l.id, l.name, l.profile, l.whatsapp, l.email, l.revenue, l.message, l.createdAt, l.status, l.note || ''
      ].map(escapeCsv).join(';'));

      const csvContent = '\uFEFF' + [headers.map(escapeCsv).join(';'), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `mgm-leads-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Arquivo CSV exportado com sucesso!');
    }

    // Upload de imagens para Supabase Storage
    async function uploadImageToSupabase(file) {
      if (!file) return null;
      const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = 'uploads/' + fileName;
      try {
        const r = await fetch(SUPA_URL + '/storage/v1/object/site-images/' + path, {
          method: 'POST',
          headers: {
            'apikey': SUPA_KEY,
            'Authorization': 'Bearer ' + (state.accessToken || SUPA_KEY),
            'Content-Type': file.type || 'application/octet-stream',
            'x-upsert': 'true',
          },
          body: file,
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.message || 'HTTP ' + r.status);
        }
        return SUPA_URL + '/storage/v1/object/public/site-images/' + path;
      } catch (e) {
        console.error('Upload error:', e);
        showToast('Erro no upload: ' + (e.message || ''), 'error');
        return null;
      }
    }

            <span class="eyebrow">Galeria de Imagens</span>
            <h3 class="font-display text-xl font-extrabold text-navy mt-2">Upload de Imagens</h3>
            <p class="text-sm text-slate-500 mt-1">Envie imagens para o Supabase Storage. O bucket "site-images" deve existir (crie no Dashboard > Storage).</p>

            <div class="mt-5 flex flex-col sm:flex-row gap-3 items-start">
              <input id="image-file-input" type="file" accept="image/*" class="field flex-1" />
              <button type="button" onclick="handleImageUpload()" class="px-5 py-2.5 rounded-xl btn-brand font-bold text-sm shrink-0">
                Enviar Imagem

            <div id="upload-status" class="mt-3 text-sm text-slate-500 hidden"></div>

            ${images.length ? `
              <div class="mt-6 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">

    async function handleImageUpload() {
      const input = document.getElementById('image-file-input');
      const file = input && input.files && input.files[0];
      if (!file) { showToast('Selecione uma imagem.', 'error'); return; }
      const status = document.getElementById('upload-status');
      if (status) { status.classList.remove('hidden'); status.textContent = 'Enviando...'; }
      const url = await uploadImageToSupabase(file);
      if (url) {
        state.uploadedImages = state.uploadedImages || [];
        state.uploadedImages.unshift({ url, name: file.name });
        if (status) status.textContent = 'Upload concluído!';
        showToast('Imagem enviada com sucesso.', 'success');
        renderApp();
      } else {
        if (status) status.textContent = 'Falha no upload.';
      }
    }

    function copyImageUrl(url) {
      navigator.clipboard.writeText(url).then(() => showToast('URL copiada!', 'success')).catch(() => showToast('Não foi possível copiar.', 'error'));
    }

    function updateConfigPath(path, value, shouldRender = false) {
      const keys = path.split('.');
      let target = state.config;
      for (let i = 0; i < keys.length - 1; i++) target = target[keys[i]];
      target[keys[keys.length - 1]] = value;
      persistAll();
      if (shouldRender) renderApp();
    }

      state.config.colors = { ...DEFAULT_COLORS };

    function exportConfigJSON() {
      const blob = new Blob([JSON.stringify(state.config, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `mgm-site-config-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Configurações exportadas em JSON!');
    }

    function triggerImportJSON() {
      const input = document.getElementById('import-json-input');
      if (input) input.click();
    }

    function handleImportJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed.identity || !parsed.hero) throw new Error('JSON inválido');
          state.config = { ...structuredClone(DEFAULT_SITE_CONFIG), ...parsed };
          persistAll();
          renderApp();
          showToast('Configurações importadas!');
        } catch {
          showToast('Arquivo JSON incompatível.', 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

        confirmLabel: 'Restaurar',

        onConfirm: () => {
          state.config = structuredClone(DEFAULT_SITE_CONFIG);

    async function uploadImageToSupabase(file) {
      if (!file) return null;
      const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = 'uploads/' + fileName;
      try {
        const r = await fetch(SUPA_URL + '/storage/v1/object/site-images/' + path, {
          method: 'POST',
          headers: {
            'apikey': SUPA_KEY,
            'Authorization': 'Bearer ' + (state.accessToken || SUPA_KEY),
            'Content-Type': file.type || 'application/octet-stream',
            'x-upsert': 'true',
          },
          body: file,
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.message || 'HTTP ' + r.status);
        }
        return SUPA_URL + '/storage/v1/object/public/site-images/' + path;
      } catch (e) {
        console.error('Upload error:', e);
        showToast('Erro no upload: ' + (e.message || ''), 'error');
        return null;
      }
    }

    async function handleImageUpload() {
      const input = document.getElementById('image-file-input');
      const file = input && input.files && input.files[0];
      if (!file) { showToast('Selecione uma imagem.', 'error'); return; }
      const status = document.getElementById('upload-status');
      if (status) { status.classList.remove('hidden'); status.textContent = 'Enviando...'; }
      const url = await uploadImageToSupabase(file);
      if (url) {
        state.uploadedImages = state.uploadedImages || [];
        state.uploadedImages.unshift({ url, name: file.name });
        if (status) status.textContent = 'Upload concluído!';
        showToast('Imagem enviada com sucesso.', 'success');
        renderApp();
      } else {
        if (status) status.textContent = 'Falha no upload.';
      }
    }

    function copyImageUrl(url) {
      navigator.clipboard.writeText(url).then(() => showToast('URL copiada!', 'success')).catch(() => showToast('Não foi possível copiar.', 'error'));
    }

window.addEventListener('DOMContentLoaded', async () => {
      initSupabaseClient();
      if (isSupabaseActive) {
        await syncFromSupabase();
      } else {
        // Em Modo Demo, entra direto no painel (pode sair para ver a tela de login)
        state.isAuthenticated = true;
        renderApp();
      }
    });
  </script>
</body>
</html>
